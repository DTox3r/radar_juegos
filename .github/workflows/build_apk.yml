name: Compilar APK en la Nube

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Respaldar AndroidManifest propio
        run: cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar scaffolding nativo de Android
        run: flutter create . --platforms=android --org com.radargamer --project-name game_deal_radar

      - name: Restaurar AndroidManifest garantizado
        run: cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK optimizado
        run: flutter build apk --release

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RadarGamer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk