name: Compilar APK en la Nube

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Respaldar archivos nativos propios
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          if [ -f android/app/src/main/kotlin/com/radargamer/game_deal_radar/MainActivity.kt ]; then
            cp android/app/src/main/kotlin/com/radargamer/game_deal_radar/MainActivity.kt /tmp/backup/MainActivity.kt
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar scaffolding nativo de Android
        run: flutter create . --platforms=android --org com.radargamer --project-name game_deal_radar

      - name: Restaurar archivos nativos garantizados
        run: |
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/radargamer/game_deal_radar
          if [ -f /tmp/backup/MainActivity.kt ]; then
            cp /tmp/backup/MainActivity.kt android/app/src/main/kotlin/com/radargamer/game_deal_radar/MainActivity.kt
          else
            echo -e "package com.radargamer.game_deal_radar\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}" > android/app/src/main/kotlin/com/radargamer/game_deal_radar/MainActivity.kt
          fi

      - name: Configurar Desugaring correctamente en Gradle
        run: |
          python3 -c "
          for path in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              try:
                  with open(path, 'r') as f:
                      content = f.read()
                  if 'build.gradle.kts' in path:
                      if 'isCoreLibraryDesugaringEnabled' not in content:
                          content = content.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
                      content += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
                  else:
                      if 'coreLibraryDesugaringEnabled' not in content:
                          content = content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
                      content += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
                  with open(path, 'w') as f:
                      f.write(content)
                  print(f'Configurado exitosamente en {path}')
                  break
              except FileNotFoundError:
                  continue
          "

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK optimizado
        run: flutter build apk --release

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RadarGamer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk